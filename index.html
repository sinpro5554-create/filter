<!DOCTYPE html> 
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>고객 성향 분석 시스템</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --text-main: #ffffff;
            --text-sub: #95a5a6;
            --point-color: #007aff;
            --disabled-color: #4a4a4a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }
        .notice-box {
            background-color: var(--surface-color);
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-sub);
            text-align: left;
            word-break: keep-all;
        }
        .camera-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 40px auto;
            display: none;
        }
        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transform: scaleX(-1);
        }
        .camera-guide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px solid var(--point-color);
            border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(11, 12, 16, 0.85);
            pointer-events: none;
            box-sizing: border-box;
        }
        .bottom-section {
            width: 100%;
            margin-bottom: 10px;
        }
        .agreement-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .agreement-box input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--point-color);
            cursor: pointer;
            margin-top: 2px;
        }
        .agreement-box label {
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.4;
            cursor: pointer;
            user-select: none;
        }
        .action-btn {
            width: 100%;
            height: 56px;
            background-color: var(--disabled-color);
            color: rgba(255, 255, 255, 0.4);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: not-allowed;
            transition: all 0.2s ease;
        }
        .action-btn.active {
            background-color: var(--point-color);
            color: var(--text-main);
            cursor: pointer;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-content p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-main);
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>고객 성향과 니즈에 맞춘 분석</h1>
        <div class="notice-box">
            촬영된 데이터는 대표님의 니즈에 맞는 가이드 안내에 적용될 뿐이며, 서버에는 어떠한 사진원본도 저장됨없이 영구 삭제 됩니다.
        </div>
    </div>

    <div class="camera-container" id="cameraContainer">
        <video id="videoFeed" autoplay playsinline muted></video>
        <div class="camera-guide"></div>
    </div>

    <div class="bottom-section">
        <div class="agreement-box" onclick="toggleCheckbox()">
            <input type="checkbox" id="agreeCheck" onclick="event.stopPropagation(); handleCheckboxChange()">
            <label for="agreeCheck">개인 정보 제공 및 맞춤 안내 분석에 동의합니다.</label>
        </div>
        <button id="actionBtn" class="action-btn" disabled onclick="executeCaptureWorkflow()">촬영 시작</button>
    </div>

    <div class="modal-overlay" id="popupModal">
        <div class="modal-content">
            <p>대표님과의 면담을 시작합니다.<br>30분 정도의 시간이 소요될 예정입니다.</p>
        </div>
    </div>

    <script>
        const isKakao = /KAKAOTALK/i.test(navigator.userAgent);
        if (isKakao) {
            location.href = 'kakaotalk://web/openExternalApp?url=' + encodeURIComponent(window.location.href);
        }

        const agreeCheck = document.getElementById('agreeCheck');
        const actionBtn = document.getElementById('actionBtn');
        const cameraContainer = document.getElementById('cameraContainer');
        const videoFeed = document.getElementById('videoFeed');
        const popupModal = document.getElementById('popupModal');
        let streamRef = null;

        function toggleCheckbox() {
            agreeCheck.checked = !agreeCheck.checked;
            handleCheckboxChange();
        }

        function handleCheckboxChange() {
            if (agreeCheck.checked) {
                actionBtn.classList.add('active');
                actionBtn.disabled = false;
            } else {
                actionBtn.classList.remove('active');
                actionBtn.disabled = true;
                stopCamera();
                cameraContainer.style.display = 'none';
                actionBtn.innerText = '촬영 시작';
            }
        }

        async function stopCamera() {
            if (streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
                streamRef = null;
            }
        }

        async function executeCaptureWorkflow() {
            if (!agreeCheck.checked) return;

            if (!streamRef) {
                try {
                    const constraints = {
                        video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 720 } },
                        audio: false
                    };
                    streamRef = await navigator.mediaDevices.getUserMedia(constraints);
                    videoFeed.srcObject = streamRef;
                    cameraContainer.style.display = 'block';
                    actionBtn.innerText = '스냅샷 촬영';
                } catch (err) {
                    alert('카메라 접근 권한이 필요합니다.');
                }
            } else {
                popupModal.classList.add('show');
                setTimeout(() => {
                    stopCamera();
                    window.location.href = 'report.html';
                }, 2000);
            }
        }
    </script>
</body>
</html>
